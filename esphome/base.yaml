esphome:
  name: ${deviceid}
  friendly_name: ${devicename}
  project:
    name: lg.erv-controller
    version: "0.9.3"

esp32:
  #board: esp32dev
  # For the FeatherS3, uncomment the next two lines and remove the line above.
  #board: um_feathers3
  variant: esp32s3
  framework:
    type: esp-idf

#esp32_ble_tracker:
#  scan_parameters:
#    active: false

#bluetooth_proxy:
#  active: false

uart:
  - id: ac_serial
    # For the FeatherS3, use GPIO18
    tx_pin: GPIO18
    rx_pin:
      # For the FeatherS3, use GPIO17
      number: GPIO17 # Keep in sync with rx_pin below.
      allow_other_uses: true
    baud_rate: 104

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - id: temp_sensor
    platform: homeassistant
    internal: true
    entity_id: ${temperature_sensor_entity_id}
  - platform: uptime
    type: timestamp
    name: Last Boot
  - platform: template
    id: co2_sensor
    name: "${devicename} CO2 Level"
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    accuracy_decimals: 0
    lambda: |-
      return 0; // Will be updated by lg_controller component

external_components:
  - source: components
    components: [lg_controller]

climate:
  - platform: lg_controller
    name: ""
    id: ${deviceid}
    uart_id: ac_serial
    rx_pin:
      # For the FeatherS3, use GPIO17
      number: GPIO17 # Keep in sync with rx_pin above.
      allow_other_uses: true
    fahrenheit: false
    # Now ERV only supports slave controller mode.
    is_slave_controller: true
    fan_speed_slow:
      name: Fan Speed Slow
      id: fan_speed_slow
      icon: mdi:fan-chevron-down
      mode: box
    fan_speed_low:
      name: Fan Speed Low
      id: fan_speed_low
      icon: mdi:fan-speed-1
      mode: box
    fan_speed_medium:
      name: Fan Speed Medium
      id: fan_speed_medium
      icon: mdi:fan-speed-2
      mode: box
    fan_speed_high:
      name: Fan Speed High
      id: fan_speed_high
      icon: mdi:fan-speed-3
      mode: box
    erv_mode:
      name: ERV Mode
      id: erv_mode
      icon: mdi:air-conditioner
    co2: co2_sensor
